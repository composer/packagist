nelmio_security:
    clickjacking:
        paths:
            '^/.*': DENY
        # Only documents can be framed, and the JSON APIs serve millions of responses per day
        content_types: ['text/html']
    forced_ssl:
        enabled: '%force_ssl%'
        hosts: '%forced_ssl_hosts%'
        hsts_max_age: 31104000 # 1y
        hsts_subdomains: true
        hsts_preload: true
    csp:
        enabled: true
        report_logger_service: logger
        hosts: []
        # CSP only governs document loading, so sending it on API responses is pure overhead
        content_types: ['text/html']
        enforce:
            browser_adaptive:
                enabled: false
            default-src:
                - 'self'
            script-src:
                - 'https:' # only a fallback for browsers without strict-dynamic, which ignore it otherwise
                - 'strict-dynamic'
            connect-src:
                - 'self'
                - 'https://*.algolia.net'
                - 'https://*.algolianet.com'
            img-src:
                - 'self'
                - 'https:'
                - 'data:'
            object-src:
                - 'none'
            style-src:
                - 'self'
                - 'unsafe-inline'
            font-src:
                - 'self'
            frame-src:
                - 'https://www.google.com/recaptcha/'
            base-uri:
                - 'none'
            # not covered by default-src
            form-action:
                - 'self'
            block-all-mixed-content: true # defaults to false, blocks HTTP content over HTTPS transport
