webauthn:
    allowed_origins: ['%env(WEBAUTHN_ORIGIN)%']
    metadata:
        enabled: true
        mds_repository: App\Security\WebAuthn\FidoMetadataRepository
        status_report_repository: App\Security\WebAuthn\FidoMetadataRepository
    creation_profiles:
        without_attestation:
            rp:
                id: '%env(WEBAUTHN_RP_ID)%'
            timeout: 60000
            # Offer ES256 and RS256 for authenticators that support either elliptic-curve or RSA keys
            public_key_credential_parameters:
                - !php/const Cose\Algorithms::COSE_ALGORITHM_ES256
                - !php/const Cose\Algorithms::COSE_ALGORITHM_RS256
        with_attestation:
            rp:
                id: '%env(WEBAUTHN_RP_ID)%'
            timeout: 60000
            public_key_credential_parameters:
                - !php/const Cose\Algorithms::COSE_ALGORITHM_ES256
                - !php/const Cose\Algorithms::COSE_ALGORITHM_RS256
            # Request manufacturer attestation so the validator can establish trust through FIDO metadata
            attestation_conveyance: !php/const Webauthn\PublicKeyCredentialCreationOptions::ATTESTATION_CONVEYANCE_PREFERENCE_DIRECT
    request_profiles:
        packagist:
            rp_id: '%env(WEBAUTHN_RP_ID)%'
            timeout: 60000
