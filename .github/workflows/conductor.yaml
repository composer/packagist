# See the Conductor setup guide at https://packagist.com/docs/conductor/getting-started

name: Private Packagist Conductor

on:
  repository_dispatch:
    types:
      - dependency_update

concurrency:
    group: ${{ github.workflow }}

permissions: {}

jobs:
  conductor:
    name: Private Packagist Conductor
    runs-on: ubuntu-24.04-arm

    permissions:
        contents: write # Allow Conductor to push commits with composer.json/.lock changes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          coverage: "none"
          extensions: "intl, zip, apcu"
          php-version: "8.4"

      # See the Conductor GitHub Action at https://github.com/packagist/conductor-github-action
      - name: "Running Conductor"
        uses: packagist/conductor-github-action@a20e46b1c1449a070539670a20087629b8eb0fd9 # 1.7.0
